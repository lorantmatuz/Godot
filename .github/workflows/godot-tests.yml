name: Godot Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot installation
        run: godot --version

      - name: Run game tests
        run: |
          mapfile -t projects < <(scripts/ci/discover-projects.sh)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::no game projects found"
            exit 1
          fi

          logdir=$(mktemp -d)
          pids=()
          for project in "${projects[@]}"; do
            game=${project%/project.godot}
            echo "Found game: $game"
            if [ ! -d "$game/tests" ]; then
              echo "::warning::$game has no tests"
              continue
            fi
            (
              godot --headless --editor --path "$game" --quit
              rc=0
              while IFS= read -r test; do
                echo "Running $test"
                res="res://${test#"$game"/}"
                godot --headless --path "$game" --script "$res" || rc=1
              done < <(find "$game/tests" -name '*.gd' -not -name '_*' | sort)
              exit $rc
            ) >"$logdir/$game.log" 2>&1 &
            pids+=($!)
          done

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done

          for log in "$logdir"/*.log; do
            game=$(basename "$log" .log)
            echo "::group::$game"
            cat "$log"
            echo "::endgroup::"
          done
          exit $status
