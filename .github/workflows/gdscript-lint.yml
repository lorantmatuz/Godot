name: GDScript Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gdtoolkit
        run: pip install gdtoolkit

      - name: Lint GDScript
        run: |
          while IFS= read -r game; do
            find "$game/scripts" "$game/tests" \
              -name '*.gd' \
              -print0 2>/dev/null
          done < <(scripts/ci/discover-projects.sh) |
          xargs -0 -r gdlint