
name: Project Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate projects
        run: |
          while IFS= read -r game; do
            bash scripts/ci/validate-project.sh "$game"
          done < <(bash scripts/ci/discover-projects.sh)
      - name: Check for tracked Godot cache
        run: |
          if git ls-files | grep -E '(^|/)\.godot/'; then
            echo "::error::Godot cache files must not be committed"
            exit 1
          fi
